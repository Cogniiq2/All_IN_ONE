# ══════════════════════════════════════════════════════════════════════════
# ⚠ THE ONLY WORKFLOW IN THIS REPOSITORY THAT WRITES TO BEDS24.
#
# It creates ONE temporary hold on ONE night of Schulstraße I, checks that
# the night is closed, releases the hold, and checks that the night is open
# again. Then it stops. Nothing else.
#
# It exists to answer the one question no read-only check can:
#   does a hold created through our adapter actually block inventory, and
#   does cancelling it actually give the night back?
#
# Read docs/beds24-write-test-plan.md before running this. It lists the
# prerequisites — in particular the Beds24 Auto Action check, which is the
# one that can reach a real person if it is wrong.
#
# ── Why it cannot fire by accident ───────────────────────────────────────
#   1. `workflow_dispatch` only — never on push, PR or schedule.
#   2. A typed confirmation input. The job is skipped unless it reads
#      exactly HOLD-AND-RELEASE.
#   3. The test itself refuses to write unless
#      BEDS24_WRITE_TEST_CONFIRM=HOLD-AND-RELEASE is in its environment.
#   4. It lives outside `tests/` under its own vitest config, so `npm test`
#      cannot reach it.
#
# ── What it does NOT touch ───────────────────────────────────────────────
# Stripe, PayPal, n8n, payments, invoices, Supabase, booking intents, the
# guest-facing flow, Schulstraße II, and any reservation it did not create
# itself. The only booking it can cancel is the one Beds24 just handed it
# an id for.
#
# ── An honest note on the secret boundary ────────────────────────────────
# The read-only workflow keeps the token away from all repository and npm
# code. This one cannot: the entire point is to exercise the repository's
# own adapter against the live API, so repo code necessarily runs with the
# token in scope. `npm ci` still runs BEFORE the token is introduced, so
# package lifecycle scripts never see it.
# ══════════════════════════════════════════════════════════════════════════

name: "[TEMP] [LIVE] ⚠ Beds24 WRITE test — hold and release"

# LIVE: creates and releases ONE real hold on the real Beds24 account.
# Manual only — never on push, pull_request or schedule.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type HOLD-AND-RELEASE to confirm a real write to Beds24'
        required: true
        default: ''
        type: string
      ref:
        description: 'Branch, tag or SHA whose adapter code runs against the live account (its code DOES see the token — see the note on the secret boundary)'
        required: true
        default: 'claude/bolagio-platform-completion'
        type: string

permissions:
  contents: read

concurrency:
  # Never two of these at once. Two concurrent runs could pick the same
  # night, and the second would abort — but serialising is cheaper than
  # reasoning about it.
  group: beds24-write-test
  cancel-in-progress: false

env:
  TARGET_REF: ${{ inputs.ref }}

jobs:
  hold-and-release:
    name: Create one hold, verify, release, verify
    # The typed confirmation. Anything else and the job does not start.
    if: inputs.confirm == 'HOLD-AND-RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # No token in scope here, so package lifecycle scripts cannot see it.
      - name: Install dependencies
        run: npm ci

      - name: Re-run the offline suite first
        # If the unit tests are red, do not write anything to a live channel
        # manager. This is the cheap gate before the expensive one.
        run: npm test

      - name: "⚠ WRITE — create hold, verify blocked, release, verify restored"
        id: write
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
          BEDS24_MODE: live
          BEDS24_WRITE_TEST_CONFIRM: HOLD-AND-RELEASE
        run: npm run test:beds24-write

      - name: Publish summary
        if: always()
        env:
          WRITE_OUTCOME: ${{ steps.write.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## ⚠ Beds24 write test — hold and release"
            echo ""
            echo "Unit under test: \`schulstrasse-i\` — Beds24 property \`354659\`, room \`731147\`"
            echo ""
            if [ "$WRITE_OUTCOME" = "success" ]; then
              echo "### ✅ Passed"
              echo ""
              echo "A hold was created, it **closed** the night, the release **reopened** it,"
              echo "and inventory is back to its original state."
              echo ""
              echo "This is the first confirmation that the hold mechanism — and therefore the"
              echo "overbooking protection that depends on it — actually works against this account."
            else
              echo "### ❌ Did not pass"
              echo ""
              echo "**Check the step log for a Beds24 booking id.** The test releases its hold in a"
              echo "\`finally\` block, so a failed assertion still gives the night back — but if the"
              echo "process died outright, a hold may still be open and must be cancelled by hand."
              echo ""
              echo "Two failures mean different things:"
              echo "- *the hold did not block the night* → the status used for holds does not close"
              echo "  inventory for this property. Check **BOOKING RULES → BOOKING STATUS** in Beds24."
              echo "- *the night is still blocked after release* → cancel the booking in Beds24 now."
            fi
            echo ""
            echo "_No payment provider, n8n workflow, invoice or guest-facing booking was involved._"
          } >> "$GITHUB_STEP_SUMMARY"
