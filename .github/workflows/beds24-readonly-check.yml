# ══════════════════════════════════════════════════════════════════════════
# TEMPORARY — Beds24 read-only live check (revision 2).
#
# Revision 1 established that authentication, property access and the
# inventory calendar all work, and that the real mapper parses the live
# calendar correctly. It also established two things that were wrong:
#
#   • `GET /properties/rooms` is NOT a V2 endpoint. It returned HTTP 500
#     with a non-JSON body. Rooms are nested inside the properties response
#     behind `includeAllRooms=true`. That call is gone from here and from
#     the integration.
#   • property 354659 is named "designAparts - II - by MorenoPisano", which
#     does not obviously correspond to the unit it was assumed to be. The
#     mapping cannot be taken on trust.
#
# So this revision stops assuming ids and ENUMERATES the account instead:
# every property the token can see, with its rooms, printed as a table a
# person can read and confirm against Beds24. That table is what the
# `bolagio_unit_integrations` rows get built from.
#
# ── What it does ─────────────────────────────────────────────────────────
#   Part A  live Beds24, read-only:
#             1. authentication
#             2. discovery — every property and room on the account
#             3. whether the currently-configured ids exist in that list
#             4. inventory calendar for the configured room
#   Part B  feature-branch validation, best-effort and non-blocking:
#             the branch's unit tests, then the REAL mapCalendar and
#             mapProperties run over the responses Part A received.
#
# ── The secret boundary, which is deliberate ─────────────────────────────
# `BEDS24_REFRESH_TOKEN` is scoped to the ONE step that needs it (Part A),
# and that step runs only the script written inline below. No feature-branch
# code and no npm dependency executes while the token is in scope: `npm ci`
# (which runs package lifecycle scripts) and everything after it cannot see
# it. Checkout uses `persist-credentials: false`.
#
# ── What it categorically does not do ────────────────────────────────────
# GET requests only. There is no code path that can reach POST /bookings or
# any other endpoint capable of creating, modifying, holding, confirming or
# cancelling a reservation. The token is never printed.
#
# Delete this file once the mapping is confirmed.
# ══════════════════════════════════════════════════════════════════════════

name: "[TEMP] [LIVE] Beds24 read-only live check"

# LIVE: talks to the real Beds24 account with a real token. Manual only —
# never on push, pull_request or schedule. Read-only (GET) by construction.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA whose integration code is validated (checked out read-only; the token never reaches its code)'
        required: true
        default: 'claude/bolagio-platform-completion'
        type: string

permissions:
  contents: read

concurrency:
  group: beds24-readonly-check
  cancel-in-progress: false

env:
  # The branch whose integration code this validates — the `ref` input,
  # defaulting to the current integration branch. The branch selector in the
  # "Run workflow" dialog chooses which workflow FILE runs, which is a
  # different thing. A free-form ref plus a live credential is acceptable
  # here only because the token is scoped to Part A, which runs the inline
  # script below and never the checked-out code. The resolved ref and SHA
  # are printed in the summary.
  TARGET_REF: ${{ inputs.ref }}
  # The CONFIRMED mapping, established by enumerating the account on
  # 2026-09-17. Each run re-verifies that these pairs still exist rather than
  # assuming they do — an id that silently stops existing would otherwise
  # surface as an empty calendar, which looks like a full month.
  # `bookingCom` is printed for cross-reference only and is never queried.
  BEDS24_UNITS: >-
    [{"slug":"schulstrasse-i","propertyId":"354659","roomId":"731147","bookingCom":"14282341"},
     {"slug":"schulstrasse-ii","propertyId":"354658","roomId":"731146","bookingCom":"14401037"}]

jobs:
  check:
    name: Read-only Beds24 smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch (read-only)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - name: Record which commit is under test
        id: target
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Checked out ${TARGET_REF} at $(git rev-parse --short HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── PART A ─────────────────────────────────────────────────────────
      - name: "Part A — live Beds24 read-only check"
        id: live
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cat <<'NODE_EOF' > "$RUNNER_TEMP/live-check.mjs"
          // Standalone and read-only. Node's global fetch, no dependencies,
          // nothing imported from the checked-out repository.
          import { writeFileSync } from 'node:fs';

          const BASE_URL = process.env.BEDS24_API_BASE_URL?.trim() || 'https://beds24.com/api/v2';
          const REFRESH_TOKEN = process.env.BEDS24_REFRESH_TOKEN?.trim();
          const UNITS = JSON.parse(process.env.BEDS24_UNITS);
          const TEMP = process.env.RUNNER_TEMP;

          const results = {
            auth: 'NOT RUN',
            discovery: 'NOT RUN',
            configuredIds: 'NOT RUN',
            calendar: 'NOT RUN',
          };

          const todayIso = () => new Date().toISOString().slice(0, 10);
          const addDaysIso = (iso, days) => {
            const d = new Date(`${iso}T00:00:00Z`);
            d.setUTCDate(d.getUTCDate() + days);
            return d.toISOString().slice(0, 10);
          };
          const pad = (v, w) => String(v ?? '').padEnd(w, ' ');
          // Third-party error text, capped. It does not need to be unbounded.
          const brief = (v) => JSON.stringify(v ?? null).slice(0, 800);
          const id = (...xs) => {
            for (const x of xs) {
              if (typeof x === 'number' && Number.isFinite(x)) return String(x);
              if (typeof x === 'string' && x.trim() !== '') return x.trim();
            }
            return undefined;
          };

          function finish() {
            console.log('════════════════════════════════════════════════════════════');
            console.log(' PART A SUMMARY — read-only, nothing created or modified');
            console.log('════════════════════════════════════════════════════════════');
            console.log(`  Authentication:        ${results.auth}`);
            console.log(`  Discovery:             ${results.discovery}`);
            console.log(`  Configured ids exist:  ${results.configuredIds}`);
            console.log(`  Inventory/calendar:    ${results.calendar}`);
            console.log('════════════════════════════════════════════════════════════');
            writeFileSync(`${TEMP}/live-results.json`, JSON.stringify(results));
            if (Object.values(results).some((v) => String(v).startsWith('FAIL'))) process.exitCode = 1;
          }

          async function main() {
            console.log('════════════════════════════════════════════════════════════');
            console.log(' BEDS24 API V2 — READ-ONLY LIVE CHECK (rev 2)');
            console.log('════════════════════════════════════════════════════════════');
            console.log(`Base URL:  ${BASE_URL}`);
            console.log('Configured mapping under test:');
            for (const u of UNITS) {
              console.log(`  ${pad(u.slug, 18)} property ${pad(u.propertyId, 8)} room ${pad(u.roomId, 8)} ` +
                          `(Booking.com ${u.bookingCom} — reference only, not queried)`);
            }
            console.log('');

            if (!REFRESH_TOKEN) {
              console.error('✗ The BEDS24_REFRESH_TOKEN secret is empty or not set on this repository.');
              results.auth = 'FAIL (secret not set)';
              finish();
              return;
            }

            // ── 1. Authentication ──────────────────────────────────────
            console.log('── 1. Authentication ──────────────────────────────────────');
            let accessToken;
            try {
              const res = await fetch(`${BASE_URL}/authentication/token`, {
                method: 'GET',
                headers: { accept: 'application/json', refreshToken: REFRESH_TOKEN },
              });
              const body = await res.json().catch(() => null);
              if (res.ok && body?.token) {
                accessToken = body.token;
                results.auth = 'PASS';
                console.log(`✓ Authenticated. Access token issued, expires in ${body.expiresIn ?? '?'}s.`);
              } else {
                results.auth = `FAIL (HTTP ${res.status})`;
                console.log(`✗ Authentication failed — HTTP ${res.status}`);
                console.log(`  Response: ${brief(body)}`);
              }
            } catch (err) {
              results.auth = `FAIL (${err.message})`;
              console.log(`✗ Authentication request errored: ${err.message}`);
            }
            console.log('');

            if (!accessToken) { finish(); return; }
            const headers = { accept: 'application/json', token: accessToken };

            // ── 2. Discovery ───────────────────────────────────────────
            // No propertyId filter: enumerate everything this token can see.
            // This is the step that establishes the mapping, instead of
            // assuming one. `GET /properties/rooms` does not exist — rooms
            // arrive nested here, behind includeAllRooms=true.
            console.log('── 2. Discovery — every property and room on the account ──');
            let properties = [];
            try {
              const res = await fetch(`${BASE_URL}/properties?includeAllRooms=true`, { headers });
              const body = await res.json().catch(() => null);
              const records = Array.isArray(body?.data) ? body.data : [];

              if (res.ok && records.length > 0) {
                results.discovery = 'PASS';
                console.log(`✓ ${records.length} property/properties visible to this account.`);
                console.log('');
                console.log('  propertyId    roomId        name');
                console.log('  ' + '─'.repeat(74));

                for (const p of records) {
                  const pid = id(p.id, p.propertyId) ?? '(no id)';
                  console.log(`  ${pad(pid, 12)}  ${pad('—', 12)}  ${p.name ?? '(unnamed)'}${p.currency ? `  [${p.currency}]` : ''}`);
                  const rooms = p.roomTypes ?? p.rooms ?? [];
                  if (rooms.length === 0) {
                    console.log(`  ${pad('', 12)}  ${pad('(none)', 12)}  — no rooms returned for this property`);
                  }
                  for (const r of rooms) {
                    const rid = id(r.id, r.roomId) ?? '(no id)';
                    const occ = r.maxPeople !== undefined ? `  sleeps ${r.maxPeople}` : '';
                    console.log(`  ${pad('', 12)}  ${pad(rid, 12)}  └─ ${r.name ?? '(unnamed room)'}${occ}`);
                  }
                  properties.push({ pid, name: p.name, rooms: rooms.map((r) => id(r.id, r.roomId)) });
                }

                console.log('');
                console.log('  → Confirm each property/room pair above against Beds24, then map');
                console.log('    each BoLaGio unit slug to the right pair. Do not assume.');
                // Handed to Part B so the real mapProperties runs over it.
                // Property and room configuration only; no guest data.
                writeFileSync(`${TEMP}/beds24-properties.json`, JSON.stringify(body));
              } else {
                results.discovery = `FAIL (HTTP ${res.status})`;
                console.log(`✗ Discovery failed or returned no properties — HTTP ${res.status}`);
                console.log(`  Response: ${brief(body)}`);
              }
            } catch (err) {
              results.discovery = `FAIL (${err.message})`;
              console.log(`✗ Discovery request errored: ${err.message}`);
            }
            console.log('');

            // ── 3. Do the configured ids actually exist? ───────────────
            console.log('── 3. Does the confirmed mapping still hold? ──────────────');
            if (properties.length === 0) {
              results.configuredIds = 'FAIL (no properties to check against)';
              console.log('✗ Nothing was discovered, so the mapping cannot be checked.');
            } else {
              const problems = [];
              for (const u of UNITS) {
                const match = properties.find((p) => p.pid === u.propertyId);
                if (!match) {
                  problems.push(`${u.slug}: property ${u.propertyId} not on this account`);
                  console.log(`✗ ${u.slug}: property ${u.propertyId} is not among the visible properties.`);
                } else if (!match.rooms.includes(u.roomId)) {
                  problems.push(`${u.slug}: room ${u.roomId} not in property ${u.propertyId}`);
                  console.log(`✗ ${u.slug}: property ${u.propertyId} ("${match.name}") exists, but room ` +
                              `${u.roomId} is not one of its rooms: [${match.rooms.join(', ') || 'none returned'}]`);
                } else {
                  console.log(`✓ ${pad(u.slug, 18)} → property ${u.propertyId} ("${match.name}"), room ${u.roomId}`);
                }
              }
              results.configuredIds = problems.length === 0 ? 'PASS' : `FAIL (${problems.join('; ')})`;
              if (problems.length === 0) {
                console.log('  Both pairs still exist. That they are the RIGHT units was settled');
                console.log('  by a person against the names above; this only re-checks they are real.');
              }
            }
            console.log('');

            // ── 4. Inventory calendar ──────────────────────────────────
            console.log('── 4. Inventory / calendar, per unit (next 30 days) ───────');
            const from = todayIso();
            const to = addDaysIso(from, 30);
            const calendarProblems = [];

            for (const u of UNITS) {
              console.log('');
              console.log(`  ${u.slug} — property ${u.propertyId}, room ${u.roomId}`);
              try {
                const params = new URLSearchParams({
                  roomId: u.roomId, propertyId: u.propertyId, startDate: from, endDate: to,
                  includeNumAvail: 'true', includeMinStay: 'true', includeMaxStay: 'true', includePrices: 'true',
                });
                const res = await fetch(`${BASE_URL}/inventory/rooms/calendar?${params.toString()}`, { headers });
                const body = await res.json().catch(() => null);
                const runs = (body?.data ?? []).flatMap((room) => room.calendar ?? []);

                if (res.ok && runs.length > 0) {
                  console.log(`  ✓ ${runs.length} run(s) covering ${from} → ${to}.`);
                  console.log('    from          to            numAvail  minStay  maxStay  price1');
                  console.log('    ' + '─'.repeat(66));
                  for (const r of runs) {
                    console.log(`    ${pad(r.from, 12)}  ${pad(r.to, 12)}  ${pad(r.numAvail, 8)}  ${pad(r.minStay, 7)}  ${pad(r.maxStay, 7)}  ${r.price1 ?? ''}`);
                  }
                  // The first unit's response is handed to Part B for the real
                  // mapper. One is enough to prove the shape.
                  if (u.slug === UNITS[0].slug) {
                    writeFileSync(`${TEMP}/beds24-calendar.json`, JSON.stringify({ body, from, to }));
                  }
                } else {
                  calendarProblems.push(`${u.slug}: HTTP ${res.status}`);
                  console.log(`  ✗ Calendar fetch failed or returned no data — HTTP ${res.status}`);
                  console.log(`    Response: ${brief(body)}`);
                }
              } catch (err) {
                calendarProblems.push(`${u.slug}: ${err.message}`);
                console.log(`  ✗ Calendar request errored: ${err.message}`);
              }
            }

            results.calendar = calendarProblems.length === 0 ? 'PASS' : `FAIL (${calendarProblems.join('; ')})`;
            console.log('');
            console.log('  → Open each room\'s calendar in Beds24 for the same range and confirm');
            console.log('    the dates match. In particular, a reservation\'s CHECKOUT date should');
            console.log('    show numAvail > 0 — it is a departure, not an occupied night.');
            console.log('');

            finish();
          }

          main();
          NODE_EOF
          node "$RUNNER_TEMP/live-check.mjs"

      # ── PART A2 — OFFER INSPECTION (read-only) ─────────────────────────
      # Added for the bedroom-package mapping (Phase 2). Captures the REAL
      # `/inventory/rooms/offers` responses the mapper is built from, which
      # guest-count parameter spelling Beds24 honours, the official API spec
      # sections for offers and bookings, and the FIELD NAMES (never values)
      # of existing bookings. GET only; the token is scoped to this step and
      # never printed; no guest data is printed or uploaded.
      - name: "Part A2 — live offer inspection (read-only)"
        id: offers
        if: always()
        continue-on-error: true
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offers-inspection"
          cat <<'NODE_EOF' > "$RUNNER_TEMP/offers-inspect.mjs"
          import { writeFileSync } from 'node:fs';
          const BASE = 'https://beds24.com/api/v2';
          const OUT = `${process.env.RUNNER_TEMP}/offers-inspection`;
          const UNITS = JSON.parse(process.env.BEDS24_UNITS);
          const save = (name, data) => writeFileSync(`${OUT}/${name}`, typeof data === 'string' ? data : JSON.stringify(data, null, 2));
          const addDays = (iso, n) => { const d = new Date(`${iso}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

          const auth = await fetch(`${BASE}/authentication/token`, { headers: { accept: 'application/json', refreshToken: process.env.BEDS24_REFRESH_TOKEN?.trim() ?? '' } });
          const authBody = await auth.json().catch(() => null);
          if (!auth.ok || !authBody?.token) { console.log(`✗ auth failed HTTP ${auth.status}`); process.exit(1); }
          const headers = { accept: 'application/json', token: authBody.token };
          const get = async (path, params) => {
            const url = `${BASE}${path}?${new URLSearchParams(params).toString()}`;
            const res = await fetch(url, { headers });
            const text = await res.text();
            let body; try { body = JSON.parse(text); } catch { body = text.slice(0, 500); }
            return { status: res.status, body };
          };

          // ── 1. Official spec: offers parameters, booking fields ──────────
          console.log('══ 1. Beds24 API V2 specification ══');
          for (const url of ['https://beds24.com/api/v2/apiV2.yaml', 'https://beds24.com/api/v2/apiV2.json', 'https://api.beds24.com/v2/apiV2.yaml']) {
            try {
              const r = await fetch(url);
              const t = await r.text();
              console.log(`${url} → HTTP ${r.status}, ${t.length} bytes`);
              if (r.ok && t.length > 1000) {
                save('spec.txt', t);
                const lines = t.split('\n');
                const around = (needle, before, after, max) => {
                  let shown = 0;
                  lines.forEach((l, i) => {
                    if (shown >= max || !l.includes(needle)) return;
                    shown += 1;
                    console.log(`--- ${needle} @ line ${i + 1}`);
                    console.log(lines.slice(Math.max(0, i - before), i + after).join('\n'));
                  });
                };
                // Run 1 established the offers parameters (numAdults/numChildren)
                // and that bookings carry offerId and infoItems. Run 2 prints
                // the booking WRITE schema itself, to see what POST accepts.
                const writeSchema = lines.findIndex((l, i) => i > 3300 && l.includes('statusCode:'));
                console.log(`--- booking write schema around line ${writeSchema + 1}`);
                console.log(lines.slice(Math.max(0, writeSchema - 120), writeSchema + 140).join('\n'));
                const info = lines.findIndex((l, i) => i > 2990 && l.includes('infoItems:'));
                console.log(`--- infoItems schema around line ${info + 1}`);
                console.log(lines.slice(info, info + 40).join('\n'));
                break;
              }
            } catch (e) { console.log(`${url} → ${e.message}`); }
          }

          // ── 2. Dates: first arrival ≥ +21d with 7 free nights in BOTH rooms
          console.log('\n══ 2. Choosing dates ══');
          const start = addDays(new Date().toISOString().slice(0, 10), 21);
          const end = addDays(start, 150);
          const free = {};
          for (const u of UNITS) {
            const c = await get('/inventory/rooms/calendar', { propertyId: u.propertyId, roomId: u.roomId, startDate: start, endDate: end, includeNumAvail: 'true', includeMinStay: 'true' });
            const days = new Map();
            for (const room of c.body?.data ?? []) for (const run of room.calendar ?? []) {
              for (let d = run.from; d <= (run.to ?? run.from); d = addDays(d, 1)) days.set(d, { avail: Number(run.numAvail ?? 0) > 0, minStay: Number(run.minStay ?? 0) });
            }
            free[u.slug] = days;
          }
          let arrival;
          for (let d = start; d < addDays(end, -8) && !arrival; d = addDays(d, 1)) {
            const ok = UNITS.every((u) => {
              const f = free[u.slug];
              if ((f.get(d)?.minStay ?? 0) > 1) return false;
              for (let i = 0; i < 7; i += 1) if (!f.get(addDays(d, i))?.avail) return false;
              return true;
            });
            if (ok) arrival = d;
          }
          if (!arrival) { console.log('✗ no common 7-night window found'); process.exit(1); }
          console.log(`arrival ${arrival} (both rooms free for 7 nights, minStay ≤ 1)`);

          // ── 3. Offers matrix ─────────────────────────────────────────────
          console.log('\n══ 3. /inventory/rooms/offers — raw responses ══');
          const cases = [
            { nights: 1, guests: 2 }, { nights: 2, guests: 2 }, { nights: 3, guests: 2 }, { nights: 7, guests: 2 },
            { nights: 1, guests: 1 }, { nights: 1, guests: 3 }, { nights: 3, guests: 3 }, { nights: 3, guests: 4 },
            { nights: 1, guests: 4 }, { nights: 2, guests: 4 }, { nights: 7, guests: 4 },
          ];
          const captured = [];
          for (const u of UNITS) {
            for (const c of cases) {
              const departure = addDays(arrival, c.nights);
              // Run 1: `numAdult` (singular) is refused with HTTP 400 code 2002
              // "Occupancy not defined"; the spec names numAdults/numChildren.
              // Also one call filtered by the spec's `offerId` query parameter.
              for (const spelling of ['numAdults', 'numAdults+offerId=1', 'numAdults+offerId=2']) {
                if (spelling !== 'numAdults' && !(c.nights === 1 && c.guests === 2)) continue;
                const params = { propertyId: u.propertyId, roomId: u.roomId, arrival, departure, numAdults: String(c.guests), numChildren: '0' };
                if (spelling.endsWith('offerId=1')) params.offerId = '1';
                if (spelling.endsWith('offerId=2')) params.offerId = '2';
                const r = await get('/inventory/rooms/offers', params);
                const label = `${u.slug} · ${c.nights}n · ${c.guests}g · ${spelling}`;
                console.log(`\n--- ${label} → HTTP ${r.status}`);
                console.log(JSON.stringify(r.body));
                captured.push({ unit: u.slug, ...c, spelling, arrival, departure, status: r.status, body: r.body });
              }
            }
          }
          save('offers.json', captured);

          // ── 4. Booking FIELD NAMES only (no values, no guest data) ──────
          console.log('\n══ 4. Booking object field names (values never printed) ══');
          const keys = new Set(); const infoCodes = new Set(); const offerIds = new Set();
          for (const u of UNITS) {
            const r = await get('/bookings', { propertyId: u.propertyId, arrivalFrom: addDays(start, -400), arrivalTo: addDays(start, -21), includeInfoItems: 'true' });
            for (const b of r.body?.data ?? []) {
              Object.keys(b).forEach((k) => keys.add(k));
              for (const it of b.infoItems ?? []) if (it?.code) infoCodes.add(String(it.code));
              if (b.offerId !== undefined) offerIds.add(String(b.offerId));
            }
            console.log(`${u.slug}: HTTP ${r.status}, ${(r.body?.data ?? []).length} booking(s) read`);
          }
          console.log(`fields: ${[...keys].sort().join(', ')}`);
          console.log(`infoItems codes in use: ${[...infoCodes].sort().join(', ') || '(none)'}`);
          console.log(`offerId values seen: ${[...offerIds].sort().join(', ') || '(field absent or never set)'}`);
          save('booking-fields.json', { fields: [...keys].sort(), infoCodes: [...infoCodes].sort(), offerIds: [...offerIds].sort() });
          console.log('\nGET only. Nothing was created or modified.');
          NODE_EOF
          node "$RUNNER_TEMP/offers-inspect.mjs"

      - name: "Part A2 — upload inspection results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beds24-offers-inspection
          path: ${{ runner.temp }}/offers-inspection/
          if-no-files-found: warn
          retention-days: 14

      # ── PART A3 — WRITE-TEST CLEANUP VERIFICATION (read-only) ──────────
      # After write-test run 38301108120: booking 94583556 (BLG-TEST99) on
      # Schulstraße I, night 2026-12-11. Reads its status, offerId and
      # infoItems (no guest fields), both rooms' calendars around the night,
      # and the status of every booking arriving in that window. GET only.
      - name: "Part A3 — verify write-test cleanup (read-only)"
        if: always()
        continue-on-error: true
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cat <<'NODE_EOF' > "$RUNNER_TEMP/cleanup-check.mjs"
