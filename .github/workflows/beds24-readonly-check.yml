          NODE_EOF
          node "$RUNNER_TEMP/cleanup-check.mjs"

      # ── PART A4 — APARTMENT IDENTITY AUDIT (read-only) ─────────────────
      # Which Beds24 property is the Penthouse and which the flat with the
      # terrace? Prints names, descriptive texts (keyword hits), every
      # channel id the API exposes, upcoming bookings per room (status,
      # dates, channel — never guest data) and one same-date price per offer.
      # GET only.
      - name: "Part A4 — apartment identity audit (read-only)"
        if: always()
        continue-on-error: true
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cat <<'NODE_EOF' > "$RUNNER_TEMP/identity-audit.mjs"
          const BASE = 'https://beds24.com/api/v2';
          const PROPS = [['354659', '731147'], ['354658', '731146']];
          const auth = await fetch(`${BASE}/authentication/token`, { headers: { accept: 'application/json', refreshToken: process.env.BEDS24_REFRESH_TOKEN?.trim() ?? '' } });
          const token = (await auth.json().catch(() => null))?.token;
          if (!token) { console.log(`✗ auth failed HTTP ${auth.status}`); process.exit(1); }
          const get = async (path, params = {}) => {
            const r = await fetch(`${BASE}${path}?${new URLSearchParams(params)}`, { headers: { accept: 'application/json', token } });
            return { status: r.status, body: await r.json().catch(() => null) };
          };
          const GUEST = /^(firstName|lastName|email|phone|mobile|address|city|postcode|country2?|company|comments|message|notes|title|fax|custom\d+|guests?)$/i;
          const walk = (v, path, out) => {
            if (Array.isArray(v)) v.forEach((x, i) => walk(x, `${path}[${i}]`, out));
            else if (v && typeof v === 'object') for (const [k, x] of Object.entries(v)) walk(x, path ? `${path}.${k}` : k, out);
            else out.push([path, v]);
            return out;
          };
          const KEY = /(^|\.)(id|name|propertyId|roomId|roomType|maxPeople|maxAdult|qty|propertyType|city|address|postcode|currency|roomSize|floor|unit|listing|hotel|channel|ota|booking|airbnb|external|mapping|rateId|offerId|offerName)/i;
          const WORD = /penthouse|terras|terrace|balkon|balcon|dach|roof|etage|stock|floor|obergeschoss|\bOG\b|qm|m²|sqm|schulstr|design|premium|wohnung/i;

          // 1. Spec: the /properties parameters and every /channels path.
          const spec = await (await fetch('https://beds24.com/api/v2/apiV2.yaml')).text();
          const lines = spec.split('\n');
          const pi = lines.findIndex((l) => /^  \/properties:\s*$/.test(l));
          const propParams = [];
          for (let i = pi; i > -1 && i < pi + 160; i += 1) { const m = /- name: (\w+)/.exec(lines[i]); if (m) propParams.push(m[1]); if (i > pi && /^  \/\S/.test(lines[i])) break; }
          console.log(`/properties parameters: ${propParams.join(', ')}`);
          const channelPaths = lines.filter((l) => /^  \/channels\S*:\s*$/.test(l)).map((l) => l.trim().replace(/:$/, ''));
          console.log(`/channels paths in spec: ${channelPaths.join(', ') || '(none)'}`);

          // 2. Properties with everything the API offers.
          const params = { includeAllRooms: 'true' };
          for (const p of propParams) if (/^include/.test(p) && p !== 'includeAllRooms') params[p] = p === 'includeTexts' ? 'all' : 'true';
          for (const [pid] of PROPS) {
            const r = await get('/properties', { ...params, id: pid });
            const prop = r.body?.data?.[0];
            console.log(`\n══ property ${pid} → HTTP ${r.status}: name=${JSON.stringify(prop?.name)}`);
            const flat = walk(prop ?? {}, '', []);
            for (const [k, v] of flat) {
              if (typeof v === 'string' && v.length > 0 && (KEY.test(k) && v.length < 200)) console.log(`  ${k} = ${JSON.stringify(v)}`);
              else if (typeof v === 'number' && KEY.test(k)) console.log(`  ${k} = ${v}`);
            }
            for (const [k, v] of flat) {
              if (typeof v === 'string' && WORD.test(v) && v.length >= 200) {
                const i = v.search(WORD);
                console.log(`  [text] ${k}: …${v.slice(Math.max(0, i - 120), i + 220).replace(/\s+/g, ' ')}…`);
              }
            }
          }

          // 3. Channel endpoints (GET, no path parameters) per property.
          for (const path of channelPaths.filter((p) => !p.includes('{'))) {
            for (const [pid] of PROPS) {
              const r = await get(path, { propertyId: pid });
              const flat = walk(r.body ?? {}, '', []).filter(([k]) => !GUEST.test(k.split('.').pop() ?? ''));
              console.log(`\n── GET ${path}?propertyId=${pid} → HTTP ${r.status}`);
              console.log('  ' + flat.slice(0, 60).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(' | ').slice(0, 2500));
            }
          }

          // 4. Upcoming bookings per room — status, dates, channel only.
          const today = new Date().toISOString().slice(0, 10);
          const until = new Date(Date.now() + 400 * 86400000).toISOString().slice(0, 10);
          for (const [pid, rid] of PROPS) {
            const r = await get('/bookings', { propertyId: pid, roomId: rid, arrivalFrom: today, arrivalTo: until });
            const rows = (r.body?.data ?? []).map((b) => `${b.arrival}→${b.departure} ${b.status} ${b.apiSource ?? b.channel ?? b.referer ?? '-'} offer=${b.offerId} roomId=${b.roomId}`);
            console.log(`\n── bookings ${pid}/${rid} arriving ${today}..${until}: ${rows.length}`);
            rows.forEach((x) => console.log(`  ${x}`));
          }

          // 5. Same-date price per offer, 2 guests, 1 and 3 nights.
          const arr = new Date(Date.now() + 120 * 86400000).toISOString().slice(0, 10);
          for (const n of [1, 3]) {
            const dep = new Date(Date.parse(arr) + n * 86400000).toISOString().slice(0, 10);
            for (const [pid, rid] of PROPS) {
              const r = await get('/inventory/rooms/offers', { propertyId: pid, roomId: rid, arrival: arr, departure: dep, numAdults: '2', numChildren: '0' });
              const offers = (r.body?.data?.[0]?.offers ?? []).map((o) => `${o.offerId}:${o.offerName}=${o.price}`).join(' ');
              console.log(`price ${pid} ${arr} ${n}n 2g → ${offers || JSON.stringify(r.body).slice(0, 200)}`);
            }
          }
          console.log('\nGET only. Nothing was created or modified.');
          NODE_EOF
          node "$RUNNER_TEMP/identity-audit.mjs"

      # ── PART A5 — identity audit, second pass (read-only) ──────────────
      # A4 truncated the Booking.com channel settings and got no texts.
      # Prints every channel's id-like fields per property, and the property
      # and room texts in de/en. GET only.
      - name: "Part A5 — identity audit, channel ids and texts (read-only)"
        if: always()
        continue-on-error: true
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cat <<'NODE_EOF' > "$RUNNER_TEMP/identity-audit-2.mjs"
          const BASE = 'https://beds24.com/api/v2';
          const PROPS = ['354659', '354658'];
          const auth = await fetch(`${BASE}/authentication/token`, { headers: { accept: 'application/json', refreshToken: process.env.BEDS24_REFRESH_TOKEN?.trim() ?? '' } });
          const token = (await auth.json().catch(() => null))?.token;
          if (!token) { console.log(`✗ auth failed HTTP ${auth.status}`); process.exit(1); }
          const get = async (path, params = {}) => {
            const r = await fetch(`${BASE}${path}?${new URLSearchParams(params)}`, { headers: { accept: 'application/json', token } });
            return { status: r.status, body: await r.json().catch(() => null) };
          };
          const walk = (v, path, out) => {
            if (Array.isArray(v)) v.forEach((x, i) => walk(x, `${path}[${i}]`, out));
            else if (v && typeof v === 'object') for (const [k, x] of Object.entries(v)) walk(x, path ? `${path}.${k}` : k, out);
            else out.push([path, v]);
            return out;
          };
          for (const pid of PROPS) {
            const r = await get('/channels/settings', { propertyId: pid });
            for (const entry of r.body?.data ?? []) {
              const ids = walk(entry, '', []).filter(([k, v]) => /(^|\.)(channel|id|[a-zA-Z]*(Id|ID|Code|code))$/.test(k) && v !== null && v !== '');
              console.log(`settings ${pid} channel=${entry.channel}: ${ids.map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(' | ').slice(0, 1500)}`);
            }
          }
          for (const pid of PROPS) {
            for (const langs of [{ includeTexts: 'de' }, { includeTexts: 'en' }, { includeTexts: 'all', includeLanguages: 'all' }]) {
              const r = await get('/properties', { id: pid, includeAllRooms: 'true', ...langs });
              const texts = walk(r.body?.data?.[0] ?? {}, '', [])
                .filter(([k, v]) => typeof v === 'string' && v.trim().length > 2 && /text|descr|summary|headline|title|name|tagline|feature|amenit/i.test(k) && !/bookingQuestions|offers\[/.test(k));
              console.log(`\ntexts ${pid} ${JSON.stringify(langs)} → HTTP ${r.status}, ${texts.length} field(s)`);
              for (const [k, v] of texts.slice(0, 40)) console.log(`  ${k} = ${JSON.stringify(v.replace(/\s+/g, ' ').slice(0, 300))}`);
              if (texts.length > 3) break;
            }
          }
          console.log('\nGET only. Nothing was created or modified.');
          NODE_EOF
          node "$RUNNER_TEMP/identity-audit-2.mjs"

      # ── PART A6 — RESERVATION COMPARISON SOURCE (read-only) ───────────
      # Every Beds24 booking on both mapped rooms, for comparison with
      # bolagio_reservations. Prints ids, status, dates, channel id, offer,
      # price, currency and timestamps, plus only the PRESENCE of guest
      # fields (never their values). Also answers three contract questions
      # the sweep depends on: does GET /bookings return cancelled bookings
      # without a status filter; does the status filter work; does
      # modifiedFrom work. GET only.
      - name: "Part A6 — reservation comparison source (read-only)"
        if: always()
        continue-on-error: true
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cat <<'NODE_EOF' > "$RUNNER_TEMP/reservation-compare.mjs"
          const BASE = 'https://beds24.com/api/v2';
          const ROOMS = [['apartment-i', '354659', '731147'], ['apartment-ii', '354658', '731146']];
          const auth = await fetch(`${BASE}/authentication/token`, { headers: { accept: 'application/json', refreshToken: process.env.BEDS24_REFRESH_TOKEN?.trim() ?? '' } });
          const token = (await auth.json().catch(() => null))?.token;
          if (!token) { console.log(`✗ auth failed HTTP ${auth.status}`); process.exit(1); }
          const get = async (path, params) => {
            const r = await fetch(`${BASE}${path}?${new URLSearchParams(params)}`, { headers: { accept: 'application/json', token } });
            return { status: r.status, body: await r.json().catch(() => null) };
          };
          const listAll = async (params) => {
            const out = []; const seen = new Set();
            for (let page = 1; page <= 20; page++) {
              const r = await get('/bookings', { ...params, page: String(page) });
              const rows = r.body?.data ?? [];
              if (r.status !== 200) { console.log(`  HTTP ${r.status} ${JSON.stringify(r.body).slice(0, 200)}`); break; }
              let fresh = 0;
              for (const b of rows) if (!seen.has(b.id)) { seen.add(b.id); out.push(b); fresh++; }
              if (!fresh || r.body?.pages?.nextPageExists === false) break;
            }
            return out;
          };
          const has = (v) => (v !== undefined && v !== null && String(v).trim() !== '' ? 'y' : '-');
          const keys = new Set();
          for (const [label, propertyId, roomId] of ROOMS) {
            const all = await listAll({ propertyId, roomId, arrivalFrom: '2025-10-01', arrivalTo: '2028-12-31', includeInvoiceItems: 'false' });
            all.sort((a, b) => String(a.arrival).localeCompare(String(b.arrival)) || a.id - b.id);
            console.log(`\n${label} (${propertyId}/${roomId}) — ${all.length} booking(s), no status filter:`);
            console.log('  id | status | arrival→departure | apiSourceId | offerId | price | currency | adults+children | name,email,phone,apiRef | bookingTime | modifiedTime');
            for (const b of all) {
              Object.keys(b).forEach((k) => keys.add(k));
              console.log(`  ${b.id} | ${b.status} | ${b.arrival}→${b.departure} | ${b.apiSourceId ?? '-'} | ${b.offerId ?? '-'} | ${b.price ?? '-'} | ${b.currency ?? '-'} | ${b.numAdult ?? '?'}+${b.numChild ?? '?'} | ${has(b.lastName)}${has(b.email)}${has(b.phone)}${has(b.apiReference)} | ${b.bookingTime ?? '-'} | ${b.modifiedTime ?? '-'}`);
            }
            const byStatus = all.reduce((m, b) => ((m[b.status] = (m[b.status] ?? 0) + 1), m), {});
            console.log(`  by status: ${JSON.stringify(byStatus)}`);
            const cancelled = await listAll({ propertyId, roomId, arrivalFrom: '2025-10-01', arrivalTo: '2028-12-31', status: 'cancelled' });
            console.log(`  status=cancelled filter → ${cancelled.length} booking(s): ${cancelled.map((b) => b.id).join(', ')}`);
            for (const [how, qs] of [
              ['comma list', `status=${encodeURIComponent('new,request,confirmed,cancelled,black,inquiry')}`],
              ['repeated params', ['new', 'request', 'confirmed', 'cancelled', 'black', 'inquiry'].map((v) => `status=${v}`).join('&')],
              ['status=confirmed only', 'status=confirmed'],
              ['status=new only', 'status=new'],
              ['status=request only', 'status=request'],
              ['status=black only', 'status=black'],
            ]) {
              const r = await fetch(`${BASE}/bookings?propertyId=${propertyId}&roomId=${roomId}&arrivalFrom=2025-10-01&arrivalTo=2028-12-31&${qs}`, { headers: { accept: 'application/json', token } });
              const body = await r.json().catch(() => null);
              const rows = body?.data ?? [];
              const st = rows.reduce((m, b) => ((m[b.status] = (m[b.status] ?? 0) + 1), m), {});
              console.log(`  ${how} → HTTP ${r.status}, ${rows.length} booking(s) ${JSON.stringify(st)} nextPage=${body?.pages?.nextPageExists}${r.status !== 200 ? ' ' + JSON.stringify(body).slice(0, 200) : ''}`);
            }
            const modified = await listAll({ propertyId, roomId, modifiedFrom: '2026-10-01T00:00:00Z' });
            console.log(`  modifiedFrom=2026-10-01 → ${modified.length} booking(s): ${modified.map((b) => `${b.id}:${b.status}`).join(', ')}`);
          }
          console.log(`\nFields present on booking objects: ${[...keys].sort().join(', ')}`);
          console.log('\nGET only. Nothing was created or modified.');
          NODE_EOF
          node "$RUNNER_TEMP/reservation-compare.mjs"

      # ── PART A7 — WEBHOOK CONFIGURATION (read-only) ────────────────────
      # Prints every webhook/notification-shaped setting Beds24 exposes for
      # both properties and the account: field paths and values, with any
      # query string or token in a URL masked. GET only.
      - name: "Part A7 — webhook configuration (read-only)"
        if: always()
        continue-on-error: true
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cat <<'NODE_EOF' > "$RUNNER_TEMP/webhook-config.mjs"
          const BASE = 'https://beds24.com/api/v2';
          const auth = await fetch(`${BASE}/authentication/token`, { headers: { accept: 'application/json', refreshToken: process.env.BEDS24_REFRESH_TOKEN?.trim() ?? '' } });
          const token = (await auth.json().catch(() => null))?.token;
          if (!token) { console.log(`✗ auth failed HTTP ${auth.status}`); process.exit(1); }
          const get = async (path, params = {}) => {
            const r = await fetch(`${BASE}${path}?${new URLSearchParams(params)}`, { headers: { accept: 'application/json', token } });
            return { status: r.status, body: await r.json().catch(() => null) };
          };
          const mask = (v) => typeof v === 'string' ? v.replace(/\?.*$/, (q) => (q ? '?<masked>' : '')).replace(/(token|secret|key)=[^&\s]+/gi, '$1=<masked>') : v;
          const walk = (v, path, out) => {
            if (Array.isArray(v)) v.forEach((x, i) => walk(x, `${path}[${i}]`, out));
            else if (v && typeof v === 'object') for (const [k, x] of Object.entries(v)) walk(x, path ? `${path}.${k}` : k, out);
            else out.push([path, v]);
            return out;
          };
          const pick = (obj) => walk(obj, '', []).filter(([k]) => /hook|notif|callback|push|autoaction|auto_action/i.test(k));
          for (const pid of ['354659', '354658']) {
            for (const params of [{ id: pid, includeAllRooms: 'true' }, { id: pid, includeAllRooms: 'true', includeTexts: 'all' }]) {
              const r = await get('/properties', params);
              const hits = pick(r.body?.data?.[0] ?? {});
              console.log(`property ${pid} ${JSON.stringify(params)} → HTTP ${r.status}, ${hits.length} webhook-shaped field(s)`);
              for (const [k, v] of hits) console.log(`  ${k} = ${JSON.stringify(mask(v))}`);
              if (r.status === 200 && r.body?.data?.[0]) console.log(`  top-level keys: ${Object.keys(r.body.data[0]).sort().join(', ')}`);
            }
          }
          for (const path of ['/accounts', '/properties/settings', '/channels/settings']) {
            const r = await get(path, path === '/channels/settings' ? { propertyId: '354659' } : {});
            const hits = pick(r.body ?? {});
            console.log(`${path} → HTTP ${r.status}, ${hits.length} webhook-shaped field(s)`);
            for (const [k, v] of hits.slice(0, 40)) console.log(`  ${k} = ${JSON.stringify(mask(v))}`);
          }
          console.log('\nGET only. Nothing was created or modified.');
          NODE_EOF
          node "$RUNNER_TEMP/webhook-config.mjs"

      # ── PART B ─────────────────────────────────────────────────────────
      # No credential from here on. Feature-branch code executes only in
      # these steps, and only after the token has gone out of scope.
      - name: "Part B — install feature-branch dependencies"
        id: install
        if: always()
        continue-on-error: true
        run: npm ci

      - name: "Part B — feature-branch unit tests"
        id: unit
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: "Part B — live responses through the REAL mappers"
        id: mapper
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          BEDS24_CALENDAR_JSON: ${{ runner.temp }}/beds24-calendar.json
          BEDS24_PROPERTIES_JSON: ${{ runner.temp }}/beds24-properties.json
        run: |
          set -euo pipefail
          cat <<'SPEC_EOF' > tests/live-mapper-compat.test.ts
          /**
           * Live Beds24 responses × the real mappers.
           *
           * Imports lib/integrations/beds24/mapper.ts itself — not a copy — so a
           * pass here means the shipped code genuinely understands what Beds24
           * actually sends, rather than what the repository assumed it sends.
           *
           * Written by the workflow at run time. Not committed.
           */
          import { existsSync, readFileSync } from 'node:fs';
          import { describe, expect, it } from 'vitest';
          import { mapCalendar, mapProperties } from '@/lib/integrations/beds24/mapper';

          const calendarPath = process.env.BEDS24_CALENDAR_JSON as string;
          const propertiesPath = process.env.BEDS24_PROPERTIES_JSON as string;

          describe.runIf(existsSync(calendarPath))('live calendar through the real mapper', () => {
            const payload = JSON.parse(readFileSync(calendarPath, 'utf8'));
            const days = mapCalendar(payload.body, payload.from, payload.to);

            it('produces one well-formed InventoryDay per date in the window', () => {
              expect(days.length).toBeGreaterThan(0);
              for (const day of days) {
                expect(day.date).toMatch(/^\d{4}-\d{2}-\d{2}$/);
                expect(typeof day.available).toBe('boolean');
                expect(typeof day.canCheckIn).toBe('boolean');
                expect(typeof day.canCheckOut).toBe('boolean');
              }
            });

            it('covers the window contiguously, with no duplicate or missing dates', () => {
              const dates = days.map((d) => d.date);
              expect(new Set(dates).size).toBe(dates.length);
              expect(dates[0]).toBe(payload.from);
            });

            it('actually read the response rather than failing closed on all of it', () => {
              const read = days.some(
                (d) => d.available || d.displayPriceCents !== undefined || d.minStay !== undefined || !d.canCheckOut
              );
              console.log(`  ${days.filter((d) => d.available).length} of ${days.length} nights read as available`);
              expect(read).toBe(true);
            });
          });

          describe.runIf(existsSync(propertiesPath))('live properties through the real mapper', () => {
            const properties = mapProperties(JSON.parse(readFileSync(propertiesPath, 'utf8')));

            it('reads at least one property with an id and a name', () => {
              expect(properties.length).toBeGreaterThan(0);
              for (const p of properties) {
                expect(p.externalPropertyId).toMatch(/^\S+$/);
                expect(p.name.length).toBeGreaterThan(0);
              }
            });

            it('prints the mapping the unit_integrations rows should be built from', () => {
              for (const p of properties) {
                console.log(`  property ${p.externalPropertyId}  ${p.name}`);
                for (const r of p.rooms) {
                  console.log(`      room ${r.externalRoomId}  ${r.name}${r.maxGuests ? `  sleeps ${r.maxGuests}` : ''}`);
                }
                if (p.rooms.length === 0) console.log('      (no rooms read from this property)');
              }
              // Rooms nested under an unexpected key would surface here as a
              // property with zero rooms, which is the thing worth knowing.
              expect(properties.some((p) => p.rooms.length > 0)).toBe(true);
            });
          });
          SPEC_EOF
          npx vitest run tests/live-mapper-compat.test.ts --reporter=verbose

      # ── Result ─────────────────────────────────────────────────────────
      - name: Publish summary
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          MAPPER_OUTCOME: ${{ steps.mapper.outcome }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          icon() { case "$1" in PASS|success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac; }

          AUTH="UNKNOWN"; DISC="UNKNOWN"; IDS="UNKNOWN"; CAL="UNKNOWN"
          RESULTS="$RUNNER_TEMP/live-results.json"
          if [ -f "$RESULTS" ]; then
            AUTH=$(node -p "require('$RESULTS').auth")
            DISC=$(node -p "require('$RESULTS').discovery")
            IDS=$(node -p "require('$RESULTS').configuredIds")
            CAL=$(node -p "require('$RESULTS').calendar")
          fi

          {
            echo "## Beds24 read-only live check (rev 2)"
            echo ""
            echo "Branch under test: \`${TARGET_REF}\` @ \`${TARGET_SHA:0:7}\`"
            echo ""
            echo "### Part A — live Beds24 API (read-only)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Authentication | $(icon "$AUTH") $AUTH |"
            echo "| Discovery — all properties + rooms | $(icon "$DISC") $DISC |"
            echo "| Confirmed mapping still valid | $(icon "$IDS") $IDS |"
            echo "| Inventory / calendar (both units) | $(icon "$CAL") $CAL |"
            echo ""
            echo "### Part B — feature-branch code (best-effort, non-blocking)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| npm ci | $(icon "$INSTALL_OUTCOME") $INSTALL_OUTCOME |"
            echo "| Unit tests | $(icon "$UNIT_OUTCOME") $UNIT_OUTCOME |"
            echo "| Live responses × real mappers | $(icon "$MAPPER_OUTCOME") $MAPPER_OUTCOME |"
            echo ""
            echo "**The property/room table is in the \`Part A\` step log, under \"Discovery\".**"
            echo "That table is what the unit mapping must be built from."
            echo ""
            echo "_GET requests only. No booking was created, modified, held, confirmed or cancelled._"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$LIVE_OUTCOME" != "success" ]; then
            echo "Part A did not fully pass — see the summary above."
            exit 1
          fi
