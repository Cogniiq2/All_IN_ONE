# ══════════════════════════════════════════════════════════════════════════
# TEMPORARY — Beds24 read-only live check.
#
# One-off diagnostic to confirm the Beds24 API V2 credentials and ids work
# before wiring the real integration up to production. Delete this file (or
# this branch) once the check has been run and the result is confirmed.
#
# What it does, and nothing else:
#   1. authentication  — exchange the refresh token for an access token
#   2. property access — GET /properties?propertyId=354659
#   3. room access     — GET /properties/rooms?propertyId=...&roomId=731147
#   4. calendar        — GET /inventory/rooms/calendar (next 30 days),
#                         then run it through the SAME mapping logic as
#                         lib/integrations/beds24/mapper.ts to confirm the
#                         live response is compatible with the existing code.
#
# It issues GET requests ONLY. There is no code path here that can reach
# POST /bookings or any other endpoint capable of creating, modifying,
# holding, confirming or cancelling a reservation.
#
# The token is read exclusively from `secrets.BEDS24_REFRESH_TOKEN`, passed
# to the job as an environment variable (which GitHub Actions automatically
# masks in logs), and is never printed, echoed or included in any output —
# only pass/fail results and non-secret response fields are shown.
# ══════════════════════════════════════════════════════════════════════════

name: "[TEMP] Beds24 read-only live check"

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: beds24-readonly-check
  cancel-in-progress: false

jobs:
  check:
    name: Read-only Beds24 smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run read-only check
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          cat <<'NODE_EOF' > check.mjs
          // Standalone, read-only. No dependencies beyond Node's global fetch.
          const BASE_URL = process.env.BEDS24_API_BASE_URL?.trim() || 'https://beds24.com/api/v2';
          const REFRESH_TOKEN = process.env.BEDS24_REFRESH_TOKEN?.trim();

          // The real ids supplied for this check. Read-only endpoints only.
          const PROPERTY_ID = '354659';
          const ROOM_ID = '731147';
          const BOOKING_COM_PROPERTY_ID = '14282341'; // printed for manual cross-check only, never queried

          const results = { auth: 'NOT RUN', property: 'NOT RUN', room: 'NOT RUN', calendar: 'NOT RUN' };
          const summaryLines = [];

          function todayIso() { return new Date().toISOString().slice(0, 10); }
          function addDaysIso(iso, days) {
            const d = new Date(`${iso}T00:00:00Z`);
            d.setUTCDate(d.getUTCDate() + days);
            return d.toISOString().slice(0, 10);
          }

          // ── The SAME calendar-mapping logic as lib/integrations/beds24/mapper.ts ──
          // (mapCalendar, num, flag, addDays) — copied here deliberately, not
          // imported, so this script stays standalone. If it drifts from the repo
          // file, that file is the source of truth.
          function num(value) {
            if (typeof value === 'number') return Number.isFinite(value) ? value : undefined;
            if (typeof value === 'string' && value.trim() !== '') {
              const n = Number(value);
              return Number.isFinite(n) ? n : undefined;
            }
            return undefined;
          }
          function flag(value) {
            if (typeof value === 'boolean') return value;
            const n = num(value);
            return n !== undefined && n !== 0;
          }
          function mapCalendar(response, from, to) {
            const entries = [];
            for (const room of response.data ?? []) {
              for (const entry of room.calendar ?? []) entries.push(entry);
            }
            const byDate = new Map();
            for (const entry of entries) {
              const start = entry.from;
              const end = entry.to ?? entry.from;
              if (!start || !end) continue;
              const available = (num(entry.numAvail) ?? 0) > 0;
              const closedArrival = flag(entry.closedArrival);
              const closedDeparture = flag(entry.closedDeparture);
              const minStay = num(entry.minStay);
              const maxStay = num(entry.maxStay);
              for (let d = start; d <= end; d = addDaysIso(d, 1)) {
                byDate.set(d, {
                  date: d,
                  available,
                  canCheckIn: available && !closedArrival,
                  canCheckOut: !closedDeparture,
                  minStay: minStay && minStay > 1 ? minStay : undefined,
                  maxStay: maxStay && maxStay > 0 ? maxStay : undefined,
                  displayPriceCents: num(entry.price1) !== undefined ? Math.round(num(entry.price1) * 100) : undefined,
                });
              }
            }
            const days = [];
            for (let d = from; d < to; d = addDaysIso(d, 1)) {
              days.push(byDate.get(d) ?? { date: d, available: false, canCheckIn: false, canCheckOut: true });
            }
            return days;
          }

          function pad(value, width) { return String(value ?? '').padEnd(width, ' '); }

          async function main() {
            console.log('════════════════════════════════════════════════════════════');
            console.log(' BEDS24 API V2 — READ-ONLY LIVE CHECK (GitHub Actions)');
            console.log('════════════════════════════════════════════════════════════');
            console.log(`Base URL:                 ${BASE_URL}`);
            console.log(`Property ID:              ${PROPERTY_ID}`);
            console.log(`Room ID:                  ${ROOM_ID}`);
            console.log(`Booking.com property ID:  ${BOOKING_COM_PROPERTY_ID}  (reference only, not queried)`);
            console.log('');

            if (!REFRESH_TOKEN) {
              console.error('✗ BEDS24_REFRESH_TOKEN secret is empty or not set. Aborting.');
              process.exitCode = 1;
              return;
            }

            console.log('── 1. Authentication ──────────────────────────────────────');
            let accessToken;
            try {
              const res = await fetch(`${BASE_URL}/authentication/token`, {
                method: 'GET',
                headers: { accept: 'application/json', refreshToken: REFRESH_TOKEN },
              });
              const body = await res.json().catch(() => null);
              if (res.ok && body?.token) {
                accessToken = body.token;
                results.auth = 'PASS';
                console.log(`✓ Authenticated. Access token issued, expires in ${body.expiresIn ?? '?'}s.`);
              } else {
                results.auth = `FAIL (HTTP ${res.status})`;
                console.log(`✗ Authentication failed — HTTP ${res.status}`);
                console.log(`  Response: ${JSON.stringify(body)}`);
              }
            } catch (err) {
              results.auth = `FAIL (${err.message})`;
              console.log(`✗ Authentication request errored: ${err.message}`);
            }
            console.log('');

            if (!accessToken) { printSummary(); process.exitCode = 1; return; }

            const authHeaders = { accept: 'application/json', token: accessToken };

            console.log('── 2. Property access ─────────────────────────────────────');
            try {
              const res = await fetch(`${BASE_URL}/properties?propertyId=${PROPERTY_ID}`, { headers: authHeaders });
              const body = await res.json().catch(() => null);
              const record = Array.isArray(body?.data) ? body.data[0] : undefined;
              if (res.ok && record) {
                results.property = 'PASS';
                console.log('✓ Property visible to this account.');
                console.log(`  name: ${record.name ?? '(not returned)'}`);
                console.log(`  currency: ${record.currency ?? '(not returned)'}`);
                console.log(`  timezone: ${record.timezone ?? '(not returned)'}`);
              } else {
                results.property = `FAIL (HTTP ${res.status})`;
                console.log(`✗ Property fetch failed or returned no record — HTTP ${res.status}`);
                console.log(`  Response: ${JSON.stringify(body)}`);
              }
            } catch (err) {
              results.property = `FAIL (${err.message})`;
              console.log(`✗ Property request errored: ${err.message}`);
            }
            console.log('');

            console.log('── 3. Room access ──────────────────────────────────────────');
            try {
              const res = await fetch(`${BASE_URL}/properties/rooms?propertyId=${PROPERTY_ID}&roomId=${ROOM_ID}`, { headers: authHeaders });
              const body = await res.json().catch(() => null);
              const record = Array.isArray(body?.data) ? body.data[0] : undefined;
              if (res.ok && record) {
                results.room = 'PASS';
                console.log('✓ Room visible to this account.');
                console.log(`  name: ${record.name ?? '(not returned)'}`);
                console.log(`  maxPeople: ${record.maxPeople ?? record.qty ?? '(not returned)'}`);
              } else {
                results.room = `FAIL (HTTP ${res.status})`;
                console.log(`✗ Room fetch failed or returned no record — HTTP ${res.status}`);
                console.log(`  Response: ${JSON.stringify(body)}`);
                console.log('  NOTE: if this 404s, the endpoint path may differ from what the');
                console.log('  repo assumes — check the current Beds24 API V2 reference.');
              }
            } catch (err) {
              results.room = `FAIL (${err.message})`;
              console.log(`✗ Room request errored: ${err.message}`);
            }
            console.log('');

            console.log('── 4. Inventory / calendar (next 30 days) ───────────────────');
            const from = todayIso();
            const to = addDaysIso(from, 30);
            try {
              const params = new URLSearchParams({
                roomId: ROOM_ID, propertyId: PROPERTY_ID, startDate: from, endDate: to,
                includeNumAvail: 'true', includeMinStay: 'true', includeMaxStay: 'true', includePrices: 'true',
              });
              const res = await fetch(`${BASE_URL}/inventory/rooms/calendar?${params.toString()}`, { headers: authHeaders });
              const body = await res.json().catch(() => null);
              const rawEntries = (body?.data ?? []).flatMap((room) => room.calendar ?? []);

              if (res.ok && rawEntries.length > 0) {
                results.calendar = 'PASS';
                console.log(`✓ Calendar data returned: ${rawEntries.length} run(s) covering ${from} → ${to}.`);
                console.log('');
                console.log('  Raw runs, as Beds24 sent them:');
                console.log('  from          to            numAvail  minStay  maxStay  price1');
                console.log('  ' + '─'.repeat(66));
                for (const e of rawEntries) {
                  console.log(`  ${pad(e.from, 12)}  ${pad(e.to, 12)}  ${pad(e.numAvail, 8)}  ${pad(e.minStay, 7)}  ${pad(e.maxStay, 7)}  ${e.price1 ?? ''}`);
                }

                console.log('');
                console.log('  Mapped through the SAME logic as lib/integrations/beds24/mapper.ts:');
                console.log('  date          available  canCheckIn  canCheckOut  minStay  priceCents');
                console.log('  ' + '─'.repeat(70));
                const mapped = mapCalendar(body, from, to);
                for (const d of mapped.slice(0, 14)) {
                  console.log(`  ${pad(d.date, 12)}  ${pad(d.available, 9)}  ${pad(d.canCheckIn, 10)}  ${pad(d.canCheckOut, 11)}  ${pad(d.minStay ?? '', 7)}  ${d.displayPriceCents ?? ''}`);
                }
                console.log(`  … (${mapped.length} days total, first 14 shown)`);
                console.log('');
                console.log('  → This mapped shape is exactly what the booking service reads.');
                console.log('    Open this room\'s calendar in the Beds24 UI for the same range and');
                console.log('    confirm the dates and availability match — especially that a');
                console.log('    reservation\'s checkout date shows canCheckIn: true (not occupied).');
              } else {
                results.calendar = `FAIL (HTTP ${res.status})`;
                console.log(`✗ Calendar fetch failed or returned no data — HTTP ${res.status}`);
                console.log(`  Response: ${JSON.stringify(body).slice(0, 2000)}`);
              }
            } catch (err) {
              results.calendar = `FAIL (${err.message})`;
              console.log(`✗ Calendar request errored: ${err.message}`);
            }
            console.log('');

            printSummary();
            if (Object.values(results).some((v) => String(v).startsWith('FAIL'))) process.exitCode = 1;
          }

          function printSummary() {
            console.log('════════════════════════════════════════════════════════════');
            console.log(' SUMMARY (read-only — nothing was created or modified)');
            console.log('════════════════════════════════════════════════════════════');
            console.log(`  Authentication:      ${results.auth}`);
            console.log(`  Property access:     ${results.property}`);
            console.log(`  Room access:         ${results.room}`);
            console.log(`  Inventory/calendar:  ${results.calendar}`);
            console.log('════════════════════════════════════════════════════════════');

            const summary = process.env.GITHUB_STEP_SUMMARY;
            if (summary) {
              const fs = require('fs');
              const icon = (v) => (v === 'PASS' ? '✅' : v.startsWith('FAIL') ? '❌' : '⏸️');
              fs.appendFileSync(summary, [
                '## Beds24 read-only live check\n',
                '| Check | Result |',
                '|---|---|',
                `| Authentication | ${icon(results.auth)} ${results.auth} |`,
                `| Property access (354659) | ${icon(results.property)} ${results.property} |`,
                `| Room access (731147) | ${icon(results.room)} ${results.room} |`,
                `| Inventory/calendar | ${icon(results.calendar)} ${results.calendar} |`,
                '\n_Read-only GET requests only. No booking was created, modified, held, confirmed or cancelled._\n',
              ].join('\n'));
            }
          }

          main();
          NODE_EOF
          node check.mjs
