          for (const [label, propertyId, roomId] of [['schulstrasse-i', '354659', '731147'], ['schulstrasse-ii', '354658', '731146']]) {
            const c = await get('/inventory/rooms/calendar', { propertyId, roomId, startDate: '2026-12-08', endDate: '2026-12-15', includeNumAvail: 'true' });
            const runs = (c.body?.data ?? []).flatMap((r) => r.calendar ?? []).map((r) => `${r.from}..${r.to ?? r.from}:numAvail=${r.numAvail}`);
